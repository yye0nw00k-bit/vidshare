{% extends 'base.html' %}{% block content %}<div class="form panel"><h1>영상 업로드</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-group"><label>제목</label><input name="title" maxlength="200" required></div><div class="form-group"><label>설명</label><textarea name="description" maxlength="5000"></textarea></div><div class="form-group"><label>영상 파일</label><input type="file" name="video" accept="video/mp4,video/webm,video/ogg,video/quicktime" required></div><div class="muted" style="margin-bottom:14px">최대 {{ config['MAX_CONTENT_LENGTH'] // (1024*1024) }}MB · 썸네일은 영상에서 자동 생성됩니다(서버에 FFmpeg가 있는 경우).</div><button class="btn-red" type="submit">게시하기</button></form></div>{% endblock %}
