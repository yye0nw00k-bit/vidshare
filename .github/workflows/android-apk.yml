name: Build VidShare Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out VidShare
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: mobile
        run: flutter create --platforms=android --project-name=vidshare_mobile --org=com.vidshare --no-pub .

      - name: Install Android API 36 and set all Android modules to compile SDK 36
        working-directory: mobile
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          python3 - <<'PY'
          from pathlib import Path

          app_gradle_file = Path("android/app/build.gradle.kts")
          app_gradle = app_gradle_file.read_text(encoding="utf-8")
          old = "compileSdk = flutter.compileSdkVersion"
          if old not in app_gradle:
              raise SystemExit("Could not find the generated app compileSdk setting.")
          app_gradle_file.write_text(
              app_gradle.replace(old, "compileSdk = 36", 1),
              encoding="utf-8",
          )

          root_gradle_file = Path("android/build.gradle.kts")
          root_gradle = root_gradle_file.read_text(encoding="utf-8")
          override = """
          // Keep Flutter Android plugin subprojects on the same compile SDK.
          subprojects {
              afterEvaluate {
                  val androidExt = project.extensions.findByName("android")
                      as? com.android.build.gradle.BaseExtension
                  if (androidExt != null) {
                      val current = androidExt.compileSdkVersion
                          ?.removePrefix("android-")
                          ?.toIntOrNull()
                      if (current == null || current < 36) {
                          androidExt.compileSdkVersion(36)
                      }
                  }
              }
          }
          """
          if "Keep Flutter Android plugin subprojects on the same compile SDK." not in root_gradle:
              root_gradle_file.write_text(root_gradle.rstrip() + "\n\n" + override, encoding="utf-8")

          print("Android app and plugin modules will compile against API 36.")
          PY

      - name: Install Flutter packages
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=VIDSHARE_API_URL=https://vidshare-1-1-1.onrender.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VidShare-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
