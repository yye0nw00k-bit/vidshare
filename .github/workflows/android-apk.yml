name: Build VidShare Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out VidShare
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: mobile/pubspec.yaml

      - name: Generate Android project files
        working-directory: mobile
        run: flutter create --platforms=android --project-name=vidshare_mobile --org=com.vidshare --no-pub .

      - name: Install Android API 36 and set compile SDK
        working-directory: mobile
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle.kts")
          gradle = gradle_file.read_text(encoding="utf-8")
          old = "compileSdk = flutter.compileSdkVersion"
          if old not in gradle:
              raise SystemExit("Could not find the generated compileSdk setting.")
          gradle_file.write_text(
              gradle.replace(old, "compileSdk = 36", 1),
              encoding="utf-8",
          )
          print("Android compile SDK set to 36.")
          PY

      - name: Install Flutter packages
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=VIDSHARE_API_URL=https://vidshare-1-1-1.onrender.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VidShare-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
