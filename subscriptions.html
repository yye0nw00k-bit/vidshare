{% extends 'base.html' %}{% block content %}<h1>구독 피드</h1><div class="muted" style="margin-bottom:18px">구독한 채널의 최신 영상입니다.</div><div class="grid">{% for v in videos %}<a class="card" href="{{ url_for('watch',video_id=v['id']) }}"><div class="thumb">{% if v['thumbnail_filename'] %}<img src="{{ url_for('static',filename='thumbnails/'+v['thumbnail_filename']) }}" alt="">{% else %}<video src="{{ url_for('video_media',filename=v['filename']) }}" muted preload="metadata"></video>{% endif %}</div><div class="card-body"><div class="title">{{ v['title'] }}</div><div class="muted">{{ v['username'] }} · 조회수 {{ v['views'] }} · 좋아요 {{ v['like_count'] }}</div></div></a>{% else %}<div class="panel">아직 구독한 채널의 영상이 없습니다.</div>{% endfor %}</div>{% endblock %}
