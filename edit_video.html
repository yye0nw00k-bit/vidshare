{% extends 'base.html' %}{% block content %}<div class="form panel"><h1>영상 수정</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-group"><label>제목</label><input name="title" maxlength="200" value="{{ video['title'] }}" required></div><div class="form-group"><label>설명</label><textarea name="description" maxlength="5000">{{ video['description'] }}</textarea></div><button class="btn-red">저장</button> <a class="btn btn-dark" href="{{ url_for('watch',video_id=video['id']) }}">취소</a></form></div>{% endblock %}
